<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Voting App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.2em;
        }
        .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .options {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
        }
        .vote-btn {
            padding: 20px 40px;
            font-size: 1.3em;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            min-width: 160px;
        }
        .vote-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .btn-a {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .btn-b {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: bold;
        }
        .hostname {
            color: #aaa;
            font-size: 0.85em;
            margin-top: 25px;
        }
        .vs {
            font-size: 1.5em;
            color: #ccc;
            font-weight: bold;
            align-self: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗳️ Cast Your Vote</h1>
        <p class="subtitle">Which one do you prefer?</p>

        <form method="POST" action="/">
            <div class="options">
                <button type="submit" name="vote" value="a" class="vote-btn btn-a">{{ option_a }}</button>
                <span class="vs">VS</span>
                <button type="submit" name="vote" value="b" class="vote-btn btn-b">{{ option_b }}</button>
            </div>
        </form>

        {% if vote %}
        <div class="success">
            ✅ You voted for <strong>{{ option_a if vote == 'a' else option_b }}</strong>!
        </div>
        {% endif %}

        <p class="hostname">Processed by container: {{ hostname }}</p>
    </div>
</body>
</html>
