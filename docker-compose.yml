version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: voting-redis
    networks:
      - voting-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: voting-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - voting-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  vote:
    build: ./vote
    container_name: voting-vote
    ports:
      - "8080:80"
    environment:
      OPTION_A: Pizza
      OPTION_B: Burger
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - voting-network

  worker:
    build: ./worker
    container_name: voting-worker
    environment:
      REDIS_HOST: redis
      DB_HOST: db
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - voting-network

  result:
    build: ./result
    container_name: voting-result
    ports:
      - "8081:80"
    environment:
      DB_HOST: db
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      OPTION_A: Pizza
      OPTION_B: Burger
    depends_on:
      db:
        condition: service_healthy
    networks:
      - voting-network

volumes:
  db-data:

networks:
  voting-network:
    driver: bridge
